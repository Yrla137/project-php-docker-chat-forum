services:
  db:
    image: mysql:8.0
    restart: no
    volumes:
      - dbstore:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secretPasswordIGuess
      MYSQL_DATABASE: mydatabase

  site:
    depends_on:
      - db
    build: .
    volumes:
      - ./html:/var/www/html
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: mydatabase
      DB_USER: root
      DB_PASSWORD: secretPasswordIGuess

  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin
    restart: no
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: secretPasswordIGuess

volumes:
  dbstore:























